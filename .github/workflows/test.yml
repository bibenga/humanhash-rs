# This workflow will build and test a Rust project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-rust

name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: [ 'stable' ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests (library only)
        run: cargo test --verbose
      - name: Run tests (with CLI)
        run: cargo test --features cli --verbose
